<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SimuLab — Login</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#0c0c10; --bg2:#111116; --bg3:#18181f; --bg4:#1e1e28;
  --line:rgba(255,255,255,0.07); --line2:rgba(255,255,255,0.14);
  --purple:#8b5cf6; --purple2:#7c3aed; --purple3:#a78bfa;
  --green:#34d399; --red:#f87171;
  --text:#f1f0f5; --text2:#a09db8; --text3:#5a5775;
  --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);display:flex;align-items:center;justify-content:center;}

/* Background grid */
body::before {
  content:''; position:fixed; inset:0; pointer-events:none;
  background-image: linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
                    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:40px 40px;
}

.card {
  background:var(--bg2); border:1px solid var(--line2);
  border-radius:16px; padding:40px 36px; width:100%; max-width:400px;
  box-shadow:0 0 60px rgba(139,92,246,.08);
  position:relative; z-index:1;
}

.logo {
  display:flex; align-items:center; gap:12px; margin-bottom:32px;
}
.logo-mark {
  width:40px; height:40px; border-radius:10px;
  background:linear-gradient(135deg,var(--purple2),var(--purple3));
  display:flex; align-items:center; justify-content:center;
  font-size:20px; box-shadow:0 0 20px rgba(139,92,246,.4);
}
.logo-text {
  font-family:var(--mono); font-size:20px; font-weight:700;
  letter-spacing:-0.5px;
}
.logo-text em { color:var(--purple3); font-style:normal; }

h1 { font-size:22px; font-weight:600; margin-bottom:6px; }
.subtitle { font-size:13px; color:var(--text2); margin-bottom:28px; }

.field { margin-bottom:16px; }
label { display:block; font-size:12px; color:var(--text2); margin-bottom:6px; font-weight:500; letter-spacing:.5px; text-transform:uppercase; }
input {
  width:100%; padding:11px 14px;
  background:var(--bg3); border:1px solid var(--line2);
  border-radius:8px; color:var(--text); font-family:var(--mono); font-size:14px;
  outline:none; transition:border-color .15s;
}
input:focus { border-color:var(--purple3); }

.btn {
  width:100%; padding:12px; border-radius:8px; border:none;
  background:linear-gradient(135deg,var(--purple2),var(--purple));
  color:#fff; font-family:var(--sans); font-size:15px; font-weight:600;
  cursor:pointer; margin-top:8px; transition:opacity .15s, transform .1s;
  box-shadow:0 4px 20px rgba(139,92,246,.3);
}
.btn:hover { opacity:.9; transform:translateY(-1px); }
.btn:active { transform:translateY(0); }

.error {
  background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.3);
  color:var(--red); padding:10px 14px; border-radius:8px;
  font-size:13px; margin-bottom:16px; display:none;
}
.error.show { display:block; }

.hint {
  margin-top:20px; padding-top:16px; border-top:1px solid var(--line);
  font-size:12px; color:var(--text3); text-align:center;
}
.hint code {
  font-family:var(--mono); color:var(--text2);
  background:var(--bg3); padding:1px 5px; border-radius:3px;
}

.role-tabs {
  display:flex; gap:8px; margin-bottom:24px;
}
.role-tab {
  flex:1; padding:8px; border-radius:6px; border:1px solid var(--line2);
  background:var(--bg3); color:var(--text2); font-size:13px; font-weight:500;
  cursor:pointer; text-align:center; transition:.15s;
}
.role-tab.active { border-color:var(--purple3); color:var(--purple3); background:rgba(139,92,246,.08); }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-mark">⚡</div>
    <div class="logo-text">Simu<em>Lab</em></div>
  </div>

  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to access your workspace</p>

  <div id="error-box" class="error"></div>

  <form id="login-form">
    <div class="field">
      <label>Username</label>
      <input id="username" type="text" placeholder="your username" autocomplete="username" required/>
    </div>
    <div class="field">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required/>
    </div>
    <button class="btn" type="submit" id="submit-btn">Sign In →</button>
  </form>

  <div class="hint">
    Default accounts: <code>teacher</code> / <code>teacher123</code>
    &nbsp;·&nbsp; <code>student1</code> / <code>student123</code>
  </div>
</div>

<script>
const form   = document.getElementById('login-form');
const errBox = document.getElementById('error-box');
const btn    = document.getElementById('submit-btn');

// Show error from redirect
const params = new URLSearchParams(location.search);
if (params.get('error') === '1') showError('Invalid username or password.');
if (params.get('logout') === '1') showError('You have been logged out.');

form.addEventListener('submit', async e => {
  e.preventDefault();
  btn.textContent = 'Signing in…'; btn.disabled = true;
  errBox.classList.remove('show');

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
    }),
  });

  const data = await res.json();
  if (res.ok) {
    // Redirect based on role
    location.href = data.role === 'teacher' ? '/teacher' : '/simulator';
  } else {
    showError(data.error || 'Login failed.');
    btn.textContent = 'Sign In →'; btn.disabled = false;
  }
});

function showError(msg) {
  errBox.textContent = msg;
  errBox.classList.add('show');
}
</script>
</body>
</html>
